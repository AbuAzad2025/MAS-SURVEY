{% extends "base.html" %}

{% block title %}MAS - الأوفست{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">[ O F F S E T S ]</div>
    
    <div class="card-body">
        <div class="dos-box">
            <div class="dos-header">Line Definition:</div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                <div class="form-group">
                    <label>Line Start Point No:</label>
                    <input type="number" id="line-start" class="form-control" placeholder="Point number" value="1">
                </div>
                <div class="form-group">
                    <label>Line End Point No:</label>
                    <input type="number" id="line-end" class="form-control" placeholder="Point number" value="2">
                </div>
            </div>
        </div>
        
        <div class="dos-box" style="margin-top: 15px;">
            <div class="dos-header">Offset Points:</div>
            
            <table class="data-table" id="offsets-table">
                <thead>
                    <tr>
                        <th>Point No</th>
                        <th>Offset Distance</th>
                        <th>Side</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="offsets-tbody">
                    <tr>
                        <td><input type="number" class="form-control" name="no[]"></td>
                        <td><input type="number" class="form-control" name="offset[]" step="0.01"></td>
                        <td>
                            <select class="form-control" name="side[]">
                                <option value="LEFT">LEFT</option>
                                <option value="RIGHT">RIGHT</option>
                            </select>
                        </td>
                        <td><input type="text" class="form-control" name="desc[]" placeholder="Description"></td>
                    </tr>
                </tbody>
            </table>
            
            <div style="margin-top: 10px;">
                <button onclick="addOffsetRow()" class="btn">+ ADD ROW</button>
                <button onclick="calculateOffsets()" class="btn btn-primary">[ CALCULATE ]</button>
            </div>
        </div>
        
        <div id="offset-result" class="dos-box" style="display: none; margin-top: 15px;">
            <div class="dos-header">Calculated Points:</div>
            <div id="offset-result-content"></div>
            <div style="margin-top: 15px;">
                <button onclick="saveOffsetResults()" class="btn btn-primary">[ SAVE RESULTS ]</button>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="{{ '/' }}" class="btn">[ BACK TO MAIN MENU ]</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
var offsetResultsData = null;

function addOffsetRow() {
    const tbody = document.getElementById('offsets-tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td><input type="number" class="form-control" name="no[]"></td>
        <td><input type="number" class="form-control" name="offset[]" step="0.01"></td>
        <td>
            <select class="form-control" name="side[]">
                <option value="LEFT">LEFT</option>
                <option value="RIGHT">RIGHT</option>
            </select>
        </td>
        <td><input type="text" class="form-control" name="desc[]" placeholder="Description"></td>
    `;
    tbody.appendChild(row);
}

async function calculateOffsets() {
    const startNo = parseInt(document.getElementById('line-start').value) || 1;
    const endNo = parseInt(document.getElementById('line-end').value) || 2;
    
    try {
        const pointsResponse = await fetch('/api/points');
        if (!pointsResponse.ok) throw new Error('Failed to fetch points');
        
        const allPoints = await pointsResponse.json();
        
        const startPoint = allPoints.find(p => p.no === startNo || p.point_no === startNo);
        const endPoint = allPoints.find(p => p.no === endNo || p.point_no === endNo);
        
        if (!startPoint || !endPoint) {
            MAS.showAlert('Line points not found', 'error');
            return;
        }
        
        const lineStart = {y: startPoint.y, x: startPoint.x};
        const lineEnd = {y: endPoint.y, x: endPoint.x};
        
        const offsetPoints = [];
        const tbody = document.getElementById('offsets-tbody');
        const rows = tbody.querySelectorAll('tr');
        
        rows.forEach(row => {
            const inputs = row.querySelectorAll('input, select');
            const no = parseInt(inputs[0].value) || 0;
            const offsetDist = parseFloat(inputs[1].value) || 0;
            const side = inputs[2].value || 'LEFT';
            
            if (no > 0 && offsetDist > 0) {
                offsetPoints.push({
                    no: no,
                    offset_distance: offsetDist,
                    side: side
                });
            }
        });
        
        if (offsetPoints.length === 0) {
            MAS.showAlert('Please enter at least one offset point', 'error');
            return;
        }
        
        const response = await fetch('/calculate/offsets', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                line_start: lineStart,
                line_end: lineEnd,
                points: offsetPoints
            })
        });
        
        if (!response.ok) {
            const err = await response.json();
            MAS.showAlert(err.error || 'Offset calculation failed', 'error');
            return;
        }
        
        const result = await response.json();
        offsetResultsData = result.results;
        
        let html = '<table class="data-table" style="width:100%;"><thead><tr>';
        html += '<th>No</th><th>Y</th><th>X</th><th>Side</th>';
        html += '</tr></thead><tbody>';
        
        result.results.forEach(p => {
            html += '<tr>';
            html += '<td>' + p.no + '</td>';
            html += '<td>' + (p.y || 0).toFixed(3) + '</td>';
            html += '<td>' + (p.x || 0).toFixed(3) + '</td>';
            html += '<td>' + p.side + '</td>';
            html += '</tr>';
        });
        
        html += '</tbody></table>';
        document.getElementById('offset-result-content').innerHTML = html;
        document.getElementById('offset-result').style.display = 'block';
        
    } catch (error) {
        MAS.showAlert('Error: ' + error.message, 'error');
    }
}

function saveOffsetResults() {
    if (!offsetResultsData || offsetResultsData.length === 0) {
        MAS.showAlert('No results to save', 'error');
        return;
    }
    
    const points = offsetResultsData.map(p => ({
        no: p.no,
        y: p.y || 0,
        x: p.x || 0,
        h: 0
    }));
    
    MAS.savePoints(points, function(result) {
        if (result.count > 0) {
            MAS.showAlert(result.count + ' offset points saved successfully', 'success');
        }
    });
}
</script>
{% endblock %}
