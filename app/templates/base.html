<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MAS - Surveying Systems Suite{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    
    <header class="header">
        <div class="header-title">S U R V E Y I N G &nbsp; S Y S T E M S &nbsp; S U I T E</div>
        <div class="header-subtitle">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>
        <div class="header-company">ALRAFIDEEN SURVEYING OFFICE</div>
        <div class="header-contact">TEL: 0562150193</div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-text">
            <span>◆</span> SURVEYING SYSTEMS SUITE <span>◆</span> ALL RIGHTS RESERVED <span>◆</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
